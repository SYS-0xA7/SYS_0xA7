    <style>
        /* --- loader --- */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050505;
            z-index: 100000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease-out, visibility 0.5s;
            cursor: none; /* hide system cursor */
        }

        .loader-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(212, 175, 55, 0.3);
            border-radius: 50%;
            border-top-color: #d4af37;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .click-text {
             font-size: 1.5rem;
             font-weight: 700;
             letter-spacing: 2px;
             color: #fff;
             cursor: none !important; /* hide system cursor */
             text-transform: uppercase;
             text-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
             transition: all 0.5s ease;
        }

        .click-text:hover {
             color: #f0e68c;
             transform: scale(1.02);
        }

        /* --- core --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            cursor: none !important;
        }

        ::selection {
    background-color: rgba(212, 175, 55, 0.4); 
    color: #fff;
            text-shadow: 0 0 5px rgba(212, 175, 55, 0.8);
        }

        #loader .spinner {
            border-color: rgba(190, 190, 190, 0.3);
            border-top-color: #d0d0d0;
        }

        .click-text,
        .activity-header,
        .badge,
        .view-counter,
        .volume-icon {
            color: #c5c5c5;
        }

        .card,
        .social-links {
            border-color: rgba(190, 190, 190, 0.3);
            box-shadow: 0 0 30px rgba(190, 190, 190, 0.1);
        }

        h1 {
            background-image: linear-gradient(90deg, #bdbdbd, #ffffff, #707070, #bdbdbd);
        }

        .badge,
        .social-links {
            background-color: rgba(190, 190, 190, 0.08);
        }

        .skill-badge:hover,
        .badge:hover,
        .social-btn:hover {
            border-color: #c5c5c5;
            background-color: rgba(190, 190, 190, 0.18);
            color: #111;
        }


        body {
            background-color: #050505;
            background-image: radial-gradient(#222 1px, transparent 1px);
            background-size: 25px 25px;
            color: #fff;
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            /* Flex and Perspective moved to .main-wrapper */
        }

        .main-wrapper {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
            position: relative;
            z-index: 5; /* lower than cursor */
        }

        /* --- custom cursor --- */

        .cursor-dot {
            width: 6px;
            height: 6px;
            background-color: #fff;
            position: fixed;
            border-radius: 50%;
            z-index: 200001;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s, background-color 0.3s;
        }

        .cursor-outline {
            width: 30px;
            height: 30px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            position: fixed;
            border-radius: 50%;
            z-index: 200000;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s, border 0.3s, background-color 0.3s;
        }

        .cursor-hover .cursor-dot {
            width: 4px;
            height: 4px;
            background-color: #d4af37;
        }

        .cursor-hover .cursor-outline {
            width: 40px;
            height: 40px;
            border-color: rgba(212, 175, 55, 0.5);
            background-color: rgba(212, 175, 55, 0.1);
        }

        #snow-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        #audio-visualizer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 25vh;
            pointer-events: none;
            z-index: 4;
        }

        /* --- card design --- */
        .card {
            background: rgba(10, 10, 10, 0.6);
            width: 440px;
            max-width: 90%;
            padding: 2.5rem;
            border-radius: 32px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.1);
            text-align: center;
            position: relative;
            z-index: 10;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.1s ease-out;
            margin: 20px auto;
            transform-style: preserve-3d;
            will-change: transform;
            overflow: hidden;
        }

        .card:hover {
            box-shadow: 0 20px 60px rgba(212, 175, 55, 0.2);
            /* background kept constant for transparency */
        }

        .card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at var(--glare-x, 50%) var(--glare-y, 50%),
                    rgba(255, 255, 255, 0.08) 0%,
                    transparent 60%);
            pointer-events: none;
            z-index: 20;
        }

        /* --- profile area --- */
        .profile-wrapper {
            position: relative;
            width: 125px;
            height: 125px;
            margin: 0 auto 20px auto;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: translateZ(50px);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease;
            background-color: #0a0a0a;
        }

        .profile-decoration {
            position: absolute;
            inset: -18px;
            width: calc(100% + 36px);
            height: calc(100% + 36px);
            object-fit: contain;
            pointer-events: none;
            z-index: 3;
            display: none;
        }

        .profile-effect {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            z-index: 2;
            display: none;
            mix-blend-mode: screen;
            opacity: 0.9;
        }

        .nameplate {
            position: absolute;
            inset: 0;
            display: none;
            width: 100%;
            height: 100%;
            max-width: none;
            max-height: none;
            margin: 0;
            object-fit: cover;
            pointer-events: none;
            z-index: 1;
            opacity: 0.95;
        }

        .nameplate-video {
            position: absolute;
            inset: 0;
            display: none;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            z-index: 1;
            opacity: 0.95;
        }

        .card > .profile-wrapper,
        .card > #username,
        .card > .custom-status,
        .card > .badge,
        .card > .skills-container,
        .card > .activities-wrapper,
        .card > .social-links {
            position: relative;
            z-index: 3;
        }

        .card > .volume-control,
        .card > .view-counter {
            z-index: 3;
        }

        .profile-items {
            display: none !important;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
            margin: -8px 0 18px;
        }

        .profile-item {
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.25);
            background: rgba(212, 175, 55, 0.08);
            border-radius: 999px;
            padding: 3px 9px;
            font-size: 0.62rem;
            letter-spacing: 0.4px;
        }

        .profile-wrapper:hover {
            transform: scale(1.1) rotate(5deg) translateZ(80px);
        }

        .profile-wrapper:hover .profile-img {
            border-color: #d4af37;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
        }


        .custom-status {
            transform: translateZ(30px);
        }

        .badge {
            transform: translateZ(35px);
        }

        .skills-container {
            transform: translateZ(35px);
        }

        .activities-wrapper {
            transform: translateZ(20px);
        }


        .view-counter {
            transform: translateZ(15px);
        }

        .status-indicator {
            position: absolute;
            bottom: 6px;
            right: 6px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 4px solid #0a0a0a;
            background-color: #747f8d;
            z-index: 2;
        }

        .status-online {
            background-color: #3ba55c;
            box-shadow: 0 0 12px #3ba55c;
        }

        .status-idle {
            background-color: #faa61a;
            box-shadow: 0 0 12px #faa61a;
        }

        .status-dnd {
            background-color: #ed4245;
            box-shadow: 0 0 12px #ed4245;
        }

        /* --- texts --- */
        h1 {
            display: inline-block;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #d4af37, #ffffff, #888888, #d4af37);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            cursor: pointer;
            transform: translateZ(40px);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: shine 5s linear infinite;
            filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.4));
        }

        h1:hover {
            transform: translateZ(60px) scale(1.06);
            animation: shine 5s linear infinite;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.6));
        }

        @keyframes shine {
            to {
                background-position: 300% center;
            }
        }

        .custom-status {
           display: inline-block;
           font-style: italic;
           color: #bbb;
           font-size: 0.9rem;
           margin-bottom: 15px;
           transition: all 0.3s ease;
           transform: translateZ(30px);
        }

        .custom-status:hover {
            color: #eee;
            transform: translateZ(45px) scale(1.02);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .badge {
            display: inline-block;
            background: rgba(212, 175, 55, 0.1);
            color: #d4af37;
            padding: 6px 16px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 25px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            letter-spacing: 1px;
            transition: all 0.3s ease;
            cursor: default;
            /* kenar kalınlığı */
            box-shadow: 0 4px 0 rgba(212, 175, 55, 0.2);
            transform: translateZ(35px);
        }

        .badge:hover {
            background: rgba(212, 175, 55, 0.2);
            border-color: #d4af37;
            transform: translateY(-2px) translateZ(50px);
            box-shadow: 0 6px 0 rgba(212, 175, 55, 0.3);
        }

        /* --- silver skill badges --- */
        .skills-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
            padding: 0 10px;
            transform-style: preserve-3d;
        }

        .skill-badge {
            display: inline-block;
            background: rgba(192, 192, 192, 0.08);
            color: #C0C0C0;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 600;
            border: 1px solid rgba(192, 192, 192, 0.2);
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            /* kenar kalınlığı */
            box-shadow: 0 3px 0 rgba(192, 192, 192, 0.15);
            transform: translateZ(20px);
        }

        .skill-badge:hover {
            background: rgba(192, 192, 192, 0.15);
            border-color: #C0C0C0;
            transform: translateY(-2px) translateZ(35px);
            color: #fff;
            box-shadow: 0 5px 0 rgba(192, 192, 192, 0.2);
        }

        /* --- activities --- */
        .activities-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .activity-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
            transform: translateZ(25px);
        }

        .activity-box:hover {
            border-color: rgba(212, 175, 55, 0.3);
            background: rgba(255, 255, 255, 0.06);
            transform: scale(1.02) translateZ(40px);
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.4);
        }

        .activity-img {
            width: 65px;
            height: 65px;
            border-radius: 14px;
            object-fit: cover;
        }

        .activity-info {
            text-align: left;
            flex: 1;
            overflow: hidden;
        }

        .activity-header {
            font-size: 0.65rem;
            color: #d4af37;
            text-transform: uppercase;
            font-weight: 800;
        }

        .activity-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
        }

        .activity-details {
            font-size: 0.8rem;
            color: #999;
        }

        /* --- fixed bottom card --- */
        .social-links {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
            background: rgba(212, 175, 55, 0.06);
            padding: 18px;
            border-radius: 24px;
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateZ(25px);
        }

        .social-links:hover {
            transform: translateY(-5px) translateZ(40px);
            background: rgba(212, 175, 55, 0.08);
            border-color: rgba(212, 175, 55, 0.4);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.15);
        }

        .social-btn {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            font-size: 1.4rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            background: #d4af37;
            color: #000;
            transform: translateY(-5px) translateZ(30px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }

        .social-btn svg {
            width: 22px;
            height: 22px;
        }

        /* spotify bar */
        .bars {
            display: flex;
            align-items: flex-end;
            height: 14px;
            gap: 2px;
            margin-left: auto;
        }

        .bar {
            width: 3px;
            background-color: #1db954;
            animation: bounce 1s infinite ease-in-out;
        }

        @keyframes bounce {

            0%,
            100% {
                height: 20%;
            }

            50% {
                height: 100%;
            }
        }

        /* view counter */
        .view-counter {
            position: absolute;
            bottom: 15px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #bbb;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .view-counter:hover {
            background: rgba(212, 175, 55, 0.1);
            color: #d4af37;
            border-color: rgba(212, 175, 55, 0.3);
            transform: scale(1.05) translateZ(10px);
        }

        .view-counter i {
            animation: eye-pulse 2s infinite;
        }

        @keyframes eye-pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        /* --- background video --- */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            filter: blur(3px) brightness(0.6);
            transform: scale(1.05); /* prevent blur edges */
        }

        /* --- volume control --- */
        .volume-control {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateZ(20px);
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .volume-control:hover {
            background: rgba(0, 0, 0, 0.6);
            border-color: rgba(212, 175, 55, 0.3);
            transform: translateX(-50%) translateZ(30px);
        }

        .volume-icon {
            color: #ccc;
            font-size: 1.1rem;
            width: 20px;
            text-align: center;
        }

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            outline: none;
            cursor: none !important;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            cursor: none !important; 
            transition: all 0.2s;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            background: #d4af37;
            transform: scale(1.2);
        }
        .volume-icon:hover {
            color: #d4af37;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            transform: scale(1.1);
        }

        /* --- mobile responsive --- */
        @media (max-width: 768px) {
            body {
                height: auto;
                min-height: 100vh;
                height: 100vh;
                overflow: hidden;
                background-size: 15px 15px; 
            }

            .main-wrapper {
                height: 100vh;
                min-height: 0;
                padding: 10px 0;
                perspective: none; 
                align-items: flex-start;
            }

            .card {
                width: 92%;
                margin: 0 auto;
                transform: none !important; 
                padding: 1.25rem 1rem 58px;
                border-radius: 24px;
                max-height: calc(100vh - 20px);
                overflow: hidden;
            }
            .card:hover {
                 transform: none !important;
                 box-shadow: 0 10px 30px rgba(212, 175, 55, 0.1);
            }
            
            .view-counter {
                left: 50%;
                transform: translateX(-50%);
                bottom: 15px;
                width: max-content;
            }

            .profile-wrapper {
                width: 90px;
                height: 90px;
                margin-bottom: 10px;
            }

            h1 {
                font-size: 1.55rem;
            }

            .badge {
                margin-bottom: 14px;
            }

            .skills-container {
                gap: 5px;
                margin-bottom: 14px;
                padding: 0 4px;
            }

            .skill-badge {
                padding: 4px 8px;
                font-size: 0.62rem;
            }

            .activities-wrapper {
                gap: 8px;
            }

            .activity-box {
                padding: 9px;
                gap: 9px;
                border-radius: 14px;
            }

            .activity-img {
                width: 48px;
                height: 48px;
            }

            .social-links {
                margin-top: 14px;
                padding: 10px;
                gap: 10px;
            }

            .social-btn {
                width: 40px;
                height: 40px;
                font-size: 1.1rem;
            }

            .volume-control {
                bottom: 60px; 
                width: 80%;
                justify-content: center;
            }
            
            input[type=range] {
                width: 100%;
            }

            .cursor-dot, .cursor-outline {
                display: none;
            }

            #audio-visualizer {
                display: none !important;
            }
            
            * {
                cursor: auto !important;
            }
        }
        /* silver accent palette */
        #loader .spinner { border-color: rgba(190, 190, 190, 0.3) !important; border-top-color: #d0d0d0 !important; }

        async function findAudibleStart() {
            if (musicStartPromise) return musicStartPromise;

            musicStartPromise = (async () => {
                try {
                    const response = await fetch('music.mp3');
                    const buffer = await response.arrayBuffer();
                    const decoded = await audioContext.decodeAudioData(buffer);
                    const samples = decoded.getChannelData(0);
                    const windowSize = Math.floor(decoded.sampleRate * 0.05);
                    const threshold = 0.0025;
                    const requiredWindows = 2;

                    for (let offset = 0; offset < samples.length - windowSize; offset += windowSize) {
                        let energy = 0;
                        for (let i = 0; i < windowSize; i++) energy += samples[offset + i] ** 2;
                        const rms = Math.sqrt(energy / windowSize);
                        if (rms >= threshold) {
                            let audibleWindows = 1;
                            for (let next = offset + windowSize; audibleWindows < requiredWindows && next < samples.length - windowSize; next += windowSize) {
                                let nextEnergy = 0;
                                for (let i = 0; i < windowSize; i++) nextEnergy += samples[next + i] ** 2;
                                if (Math.sqrt(nextEnergy / windowSize) >= threshold) audibleWindows++;
                                else break;
                            }
                            if (audibleWindows === requiredWindows) return Math.max(0, offset / decoded.sampleRate - 0.02);
                        }
                    }
                } catch (error) {
                    console.warn('Music silence scan failed:', error);
                }
                return 0;
            })();

            return musicStartPromise;

        function collectibleUrl(asset, type) {
            if (!asset) return '';
            if (typeof asset === 'object') {
                asset = asset.url || asset.src || asset.staticFrameSrc || asset.thumbnailPreviewSrc ||
                    asset.asset || asset.effects?.[0]?.src;
            }
            if (!asset || typeof asset !== 'string') return '';
            if (/^https?:\/\//i.test(asset)) return asset;
            if (type === 'decoration' || asset.startsWith('a_')) {
                return `https://cdn.discordapp.com/avatar-decoration-presets/${asset}.png?size=256&passthrough=true`;
            }
            const collectibleAsset = asset.endsWith('/') ? `${asset}static.png` : asset;
            return `https://cdn.discordapp.com/assets/collectibles/${collectibleAsset}${/\.(?:png|gif|webp|apng)$/i.test(collectibleAsset) ? '' : '.png'}`;
        }

            const effect = data.profile_effect || data.profile_effect_data ||

                user.collectibles?.profile_effect;
            const decorationEl = document.getElementById('profile-decoration');

        // 3d tilt effect logic

        document.addEventListener('mouseleave', () => isMouseOut = true);
        document.addEventListener('mouseenter', () => isMouseOut = false);

        function updateCardTilt() {
            if (window.innerWidth <= 768) return;

            const limit = 15;
            let targetX = 0, targetY = 0;

            if (!isMouseOut) {
                targetX = (mouseY - window.innerHeight / 2) / (window.innerHeight / 2) * -limit;
                targetY = (mouseX - window.innerWidth / 2) / (window.innerWidth / 2) * limit;

                const cardRect = card.getBoundingClientRect();
                const gx = ((mouseX - cardRect.left) / cardRect.width) * 100;
                const gy = ((mouseY - cardRect.top) / cardRect.height) * 100;
                card.style.setProperty('--glare-x', `${gx}%`);
                card.style.setProperty('--glare-y', `${gy}%`);
            }

            cardRotateX += (targetX - cardRotateX) * 0.1;
            cardRotateY += (targetY - cardRotateY) * 0.1;
            card.style.transform = `perspective(1000px) rotateX(${cardRotateX}deg) rotateY(${cardRotateY}deg)`;
            requestAnimationFrame(updateCardTilt);

        // click to enter logic

        // --- Audio Visualizer ---
        let audioContext, analyser, source;
        const vCanvas = document.getElementById('audio-visualizer');
        const vCtx = vCanvas.getContext('2d');

        function resizeVisualizer() {
            vCanvas.width = vCanvas.offsetWidth;
            vCanvas.height = vCanvas.offsetHeight;
        }
        window.addEventListener('resize', resizeVisualizer);

        function initVisualizer() {
            resizeVisualizer();
            if(audioContext) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioContext();
                analyser = audioContext.createAnalyser();
                analyser.smoothingTimeConstant = 0.92; // smoother

                source = audioContext.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioContext.destination);

                analyser.fftSize = 32; // valid power-of-two FFT size
                visualize();
            } catch(e) {
                console.error("Visualizer init failed:", e);
            }
        }

        function visualize() {
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            const draw = () => {
                requestAnimationFrame(draw);
                
                if(!analyser) return;
                analyser.getByteFrequencyData(dataArray);

                vCtx.clearRect(0, 0, vCanvas.width, vCanvas.height);

                // Symmetrical: Edges to Center
                // We map frequencies 0..N to Outer..Center
                const halfWidth = vCanvas.width / 2;
                // utilize only lower half of frequencies for better visual? 
                // typically high freqs are empty. Let's use roughly 70% of bin count to stretch useful data.
                const usefulBins = Math.max(6, Math.floor(bufferLength * 0.6));
                const barWidth = (halfWidth / usefulBins);
                const barGap = Math.min(4, barWidth * 0.16);
                
                let barHeight;

                for (let i = 0; i < usefulBins; i++) {
                    // scale height slightly down if it's too aggressive
                    barHeight = dataArray[i] * 0.8; 

                    const scaledHeight = (barHeight / 255) * vCanvas.height;

                    const gradient = vCtx.createLinearGradient(0, vCanvas.height - scaledHeight, 0, vCanvas.height);
                    gradient.addColorStop(0, '#bdbdbd');
                    gradient.addColorStop(1, 'rgba(189, 189, 189, 0)');

                    vCtx.fillStyle = gradient;

                    // Left Side: 0 at x=0
                    const xLeft = i * barWidth;
                    // Right Side: 0 at x=width
                    const xRight = vCanvas.width - ((i + 1) * barWidth);

                    vCtx.fillRect(xLeft + barGap / 2, vCanvas.height - scaledHeight, Math.max(2, barWidth - barGap), scaledHeight);
                    vCtx.fillRect(xRight + barGap / 2, vCanvas.height - scaledHeight, Math.max(2, barWidth - barGap), scaledHeight);
                }
            };
            draw();
        }

            const loader = document.getElementById('loader');

                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
                
                // play media
                const vid = document.getElementById('bg-video');
                if(vid.paused) vid.play().catch(()=>{});

                // init visualizer
                if (!audioContext) initVisualizer();
                if (audioContext && audioContext.state === 'suspended') audioContext.resume();

                // play audio if volume is allowed
                if (audio.volume > 0) {
                    playMusicFromAudibleStart().catch(e => console.log("Audio play error", e));
                }
            });
        });
    </script>
</body>

</html>
